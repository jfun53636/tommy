[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tommy-lab"
version = "0.1.0"
description = "Data Analytics Laboratory Practice Toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Jothi Sai M"}
]
dependencies = [
    "numpy",
    "matplotlib",
    "scikit-learn",
    "pandas",
    "seaborn",
    "torch",
    "torchvision",
    "pillow"
]

[tool.setuptools.packages.find]
include = ["gomma_lab*"]

[project.scripts]
tommy-lab = "gomma_lab.cli:main"
